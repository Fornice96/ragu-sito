# Publishes the site to Cloudflare on every push to main.
# Replaces Cloudflare's own Git builds, which on the free plan could sit
# ~10 minutes in "Initializing build environment" before starting.
# Needs the repo secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template).
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Wrangler 4 straight from npm (the old wrangler-action defaulted to v3,
      # which can't deploy an assets-only site).
      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx -y wrangler@4.145.0 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      # Surface the last log lines as annotations, readable without signing in.
      - name: Report deploy error
        if: failure()
        run: tail -n 10 "$RUNNER_TEMP/deploy.log" | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | sed 's/^/::error::/'
