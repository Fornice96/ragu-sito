# Publishes the site to Cloudflare on every push to main.
# Replaces Cloudflare's own Git builds, which on the free plan could sit
# ~10 minutes in "Initializing build environment" before starting.
# Needs the repo secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template).
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # the action defaults to Wrangler 3, which can't deploy an assets-only site
          wranglerVersion: "4.145.0"
          command: deploy
